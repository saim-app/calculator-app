<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-box">
        <h2>Length Converter</h2>

        <input type="number" id="lengthInput" placeholder="Enter Value">

        <select id="lengthFrom">
            <option value="meter">Meter</option>
            <option value="kilometer">Kilometer</option>
            <option value="centimeter">Centimeter</option>
            <option value="millimeter">Millimeter</option>
            <option value="mile">Mile</option>
            <option value="foot">Foot</option>
            <option value="inch">Inch</option>
        </select>

        <select id="lengthTo">
            <option value="meter">Meter</option>
            <option value="kilometer">Kilometer</option>
            <option value="centimeter">Centimeter</option>
            <option value="millimeter">Millimeter</option>
            <option value="mile">Mile</option>
            <option value="foot">Foot</option>
            <option value="inch">Inch</option>
        </select>

        <button onclick="convertLength()">Convert</button>

        <h3 id="lengthResult">Result:</h3>

        <a href="index.html">Back to Home</a>
    </div>

    <script src="script.js"></script>
    <!-- Weight Converter -->
<div class="converter-box">
    <h2>Weight Converter</h2>

    <input type="number" id="weightInput" placeholder="Enter Weight">

    <select id="weightFrom">
        <option value="kg">Kilogram</option>
        <option value="g">Gram</option>
        <option value="mg">Milligram</option>
        <option value="lb">Pound</option>
        <option value="oz">Ounce</option>
    </select>

    <select id="weightTo">
        <option value="kg">Kilogram</option>
        <option value="g">Gram</option>
        <option value="mg">Milligram</option>
        <option value="lb">Pound</option>
        <option value="oz">Ounce</option>
    </select>

    <button onclick="convertWeight()">Convert</button>

    <h3 id="weightResult">Result:</h3>
</div>
    
    <!-- Currency Converter Link -->
<div class="converter-box">
    <h2>Currency Converter</h2>
    <button type="button" onclick="window.location.href='Currency.html'">
        Open Currency Converter
    </button>
</div>

</body>
</html>
