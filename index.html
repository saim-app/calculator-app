
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">
  <title>Pro Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <h2>PRO CALCULATOR</h2>

    <input type="text" id="display" value="0" readonly
      aria-label="Calculator display">
    <button id="copyResult" type="button">
  📋 Copy Result
</button>

 <div class="memory-buttons">
  <button id="memoryAdd" type="button">M+</button>
  <button id="memorySubtract" type="button">M−</button>
  <button id="memoryRecall" type="button">MR</button>
  <button id="memoryClear" type="button">MC</button>
</div>
    <div class="mode-switch">
  <button id="standardMode" type="button">Standard</button>
  <button id="scientificMode" type="button">Scientific</button>
</div> 
    <div class="buttons">
      <div id="scientificPanel" class="calculator-panel" hidden>
        <button id="angleMode" class="utility" type="button">DEG</button>
      <button class="utility" data-action="sin">sin</button>
<button class="utility" data-action="cos">cos</button>
<button class="utility" data-action="tan">tan</button>
<button class="utility" data-action="log">log</button>
<button class="utility" data-action="ln">ln</button>
<button class="utility" data-action="pi">π</button>
<button class="utility" data-action="power">xʸ</button>
      <button class="utility" data-action="factorial">!</button>
        </div>

      <div id="standardPanel" class="calculator-panel">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="utility" data-value="(">(</button>
      <button class="utility" data-value=")">)</button>

      <button class="utility" data-value="%">%</button>
      <button class="utility" data-action="sqrt">√</button>
      <button class="utility" data-action="square">x²</button>
      <button class="utility" data-action="reciprocal">1/x</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="-">−</button>

      <button class="utility" data-action="sign">+/−</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="operator" data-value="+">+</button>

      <button class="equals" data-action="calculate">=</button>
        <button class="utility" data-action="answer">ANS</button>
</div>
    </div>
    <section class="history">
  <h3>Calculation History</h3>
  <button id="clearHistory" type="button">Clear History</button>
      <button id="exportHistory" type="button">
  📥 Export History
</button>
  <ul id="historyList"></ul>
</section>
  </main>
  <button id="themeToggle" type="button">
  ☀️ Light Mode
    <button id="soundToggle" type="button">
  🔊 Sound On
</button>
</button>

  <script src="script.js"></script>
</body>
</html>
